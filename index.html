<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carmen Sandiego</title>
<meta name="theme-color" content="#0e0f12">
<!-- Lets the page be added to a phone's home screen and open full-screen from there. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Carmen">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
    :root {
        --bg: #0e0f12;
        --panel: #17191e;
        --panel-2: #20232a;
        --line: #2c3038;
        --text: #e8e6e3;
        --muted: #9a9ca3;
        --accent: #c8102e;
        --accent-2: #e8b33a;
        --radius: 10px;
        color-scheme: dark;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
        margin: 0;
        min-height: 100vh;
        /* No double-tap zoom: a quick double tap is a double click in the game. */
        touch-action: manipulation;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        background: radial-gradient(1200px 600px at 50% -10%, #2a1418 0%, var(--bg) 60%) fixed, var(--bg);
        color: var(--text);
        font: 14px/1.4 system-ui, "Segoe UI", sans-serif;
    }
    header {
        display: flex;
        align-items: center;
        gap: 14px;
        max-width: 1400px;
        margin: 0 auto;
        padding: 18px 24px 10px;
    }
    .mark {
        width: 34px;
        height: 34px;
        flex: none;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 3px rgb(200 16 46 / 0.25);
        display: grid;
        place-items: center;
    }
    h1 {
        margin: 0;
        font: 700 20px/1.2 Georgia, "Times New Roman", serif;
        letter-spacing: 0.01em;
    }
    h1 em { color: var(--accent-2); font-style: italic; }
    .sub { color: var(--muted); font-size: 13px; }

    main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 6px 16px 32px;
    }

    /* The screen sits in a bezel; #scaler is sized to the scaled screen and
       #screen_container is scaled into it with a transform. */
    .bezel {
        padding: 14px;
        border-radius: 18px;
        background: linear-gradient(180deg, #2a2d34, #1a1c21);
        box-shadow: 0 1px 0 rgb(255 255 255 / 0.06) inset, 0 20px 60px rgb(0 0 0 / 0.55);
    }
    #stage { position: relative; display: grid; place-items: center; background: #000; border-radius: 6px; }
    #scaler { position: relative; overflow: hidden; width: 640px; height: 480px; background: #000; }
    #screen_container { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
    /* v86 resizes the canvas to cancel out display scaling; keep it at its own resolution
       and let the size buttons do the scaling. */
    #screen_container canvas { display: block; width: auto !important; height: auto !important; image-rendering: pixelated !important; }
    #stage.smooth #screen_container canvas { image-rendering: auto !important; }
    #crt {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
            repeating-linear-gradient(180deg, rgb(0 0 0 / 0.28) 0 1px, transparent 1px 3px),
            radial-gradient(ellipse at center, transparent 60%, rgb(0 0 0 / 0.35) 100%);
        mix-blend-mode: multiply;
    }
    #crt[hidden] { display: none; }
    #stage:fullscreen { width: 100vw; height: 100vh; border-radius: 0; }

    #start {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        border: 0;
        padding: 0;
        background: rgb(8 8 10 / 0.62);
        color: var(--text);
        font: inherit;
        cursor: pointer;
    }
    #start[hidden] { display: none; }
    #start .play {
        width: 92px;
        height: 92px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--accent);
        box-shadow: 0 10px 30px rgb(200 16 46 / 0.45), 0 0 0 6px rgb(255 255 255 / 0.08);
        transition: transform 120ms ease;
    }
    #start:not(:disabled):hover .play { transform: scale(1.06); }
    #start .label { font: 700 22px Georgia, serif; }
    #start .hint { color: var(--muted); font-size: 13px; }
    #start:disabled { cursor: progress; }
    #start:disabled .play { background: var(--panel-2); box-shadow: none; }
    #start:disabled .play svg { display: none; }
    #start:disabled .play::after {
        content: "";
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid var(--line);
        border-top-color: var(--accent-2);
        animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 10px 18px;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--panel);
    }
    .group { display: flex; align-items: center; gap: 8px; }
    .group-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
    .sep { width: 1px; height: 24px; background: var(--line); }
    button.icon, .segmented button, .toggle {
        font: inherit;
        color: var(--text);
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 8px;
        height: 32px;
        padding: 0 10px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
    }
    button.icon { width: 34px; padding: 0; justify-content: center; }
    button:hover { border-color: #444a55; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
    .segmented { display: inline-flex; }
    .segmented button { border-radius: 0; margin-left: -1px; }
    .segmented button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
    .segmented button:last-child { border-radius: 0 8px 8px 0; }
    .segmented button[aria-pressed="true"], .toggle[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        position: relative;
    }
    input[type="range"] { width: 110px; accent-color: var(--accent); }
    svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    #mute .off { display: none; }
    #mute[aria-pressed="true"] .on { display: none; }
    #mute[aria-pressed="true"] .off { display: inline; }

    details {
        width: min(100%, 900px);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--panel);
        color: var(--muted);
    }
    summary { cursor: pointer; padding: 10px 14px; user-select: none; }
    .details-body { display: grid; gap: 8px; padding: 0 14px 14px; font: 12px/1.5 ui-monospace, Consolas, monospace; }
    .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-family: system-ui, sans-serif; }
    .tools button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    .tools[hidden] { display: none; }

    footer { max-width: 900px; margin: 0 auto; padding: 0 16px 28px; color: var(--muted); font-size: 12px; text-align: center; }
    footer a { color: var(--muted); }

    /* Keyboard and Trackpad only make sense with a touch screen. */
    .touch-only { display: none; }
    @media (pointer: coarse) {
        .touch-only { display: inline-flex; }
        button.icon, .segmented button, .toggle { height: 38px; }
        button.icon { width: 40px; }
    }
    #type-here { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }

    .rotate-hint { display: none; }
    @media (orientation: portrait) and (max-width: 600px) {
        .rotate-hint {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 0 16px 8px;
            padding: 8px 12px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--panel);
            color: var(--muted);
            font-size: 13px;
        }
    }

    @media (max-width: 700px) {
        header { padding: 14px 16px 6px; }
        h1 { font-size: 17px; }
        .sub { display: none; }
        .sep { display: none; }
        .bezel { padding: 6px; border-radius: 12px; }
        .toolbar { gap: 8px 10px; padding: 8px; }
        .group-label { display: none; }
    }

    /* A phone on its side: no header or footer, and the controls in a column beside the
       game so it can use the full height. */
    @media (orientation: landscape) and (max-height: 500px) {
        header, footer, details { display: none; }
        main { flex-direction: row; justify-content: center; align-items: center; gap: 10px; min-height: 100vh; padding: 6px; }
        .bezel { padding: 4px; border-radius: 10px; }
        /* Every control becomes a cell in a two-column grid. */
        .toolbar { display: grid; grid-template-columns: repeat(2, auto); padding: 6px; gap: 6px; }
        .toolbar .group, .segmented, .touch-only.group { display: contents; }
        .toolbar button, .segmented button, .segmented button:first-child, .segmented button:last-child {
            width: auto; height: 34px; margin: 0; border-radius: 8px; justify-content: center; padding: 0 8px;
        }
        .group-label, .sep, #volume { display: none; }
    }
</style>
</head>
<body>
<header>
    <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" style="stroke:#fff"><path d="M3 13c3-1 15-1 18 0M7 13c0-4 2-7 5-7s5 3 5 7"/></svg>
    </div>
    <div>
        <h1>Where in the World is <em>Carmen Sandiego?</em></h1>
        <div class="sub">Deluxe Edition · Windows 98 running in your browser</div>
    </div>
</header>

<div class="rotate-hint">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M21 12a9 9 0 0 1-9 9M18 21h-6v-1"/></svg>
    Turn your phone sideways for a bigger screen
</div>

<main>
    <div class="bezel">
        <div id="stage">
            <div id="scaler">
                <div id="screen_container">
                    <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
                    <canvas style="display: none"></canvas>
                </div>
                <div id="crt" hidden></div>
                <button id="start" type="button" disabled>
                    <span class="play">
                        <svg viewBox="0 0 24 24" style="width:40px;height:40px;fill:#fff;stroke:none"><path d="M8 5v14l11-7z"/></svg>
                    </span>
                    <span class="label">Loading…</span>
                    <span class="hint">Preparing the game</span>
                </button>
            </div>
        </div>
    </div>

    <div class="toolbar" role="toolbar" aria-label="Viewer controls">
        <div class="group">
            <button id="mute" class="icon" type="button" aria-pressed="false" aria-label="Mute" title="Mute">
                <svg class="on" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
                <svg class="off" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6M22 9l-6 6"/></svg>
            </button>
            <input id="volume" type="range" min="0" max="100" value="80" aria-label="Volume" title="Volume">
        </div>
        <span class="sep"></span>
        <div class="group">
            <span class="group-label">Size</span>
            <div class="segmented" id="size">
                <button type="button" data-scale="1">1×</button>
                <button type="button" data-scale="1.5">1.5×</button>
                <button type="button" data-scale="2">2×</button>
                <button type="button" data-scale="fit">Fit</button>
            </div>
        </div>
        <span class="sep"></span>
        <div class="group">
            <button id="smooth" class="toggle" type="button" aria-pressed="false" title="Smooth the pixels when scaling">Smooth</button>
            <button id="crt-toggle" class="toggle" type="button" aria-pressed="false" title="Old monitor scanlines">CRT</button>
        </div>
        <span class="sep touch-only"></span>
        <div class="group touch-only">
            <button id="keyboard" class="icon" type="button" aria-label="Keyboard" title="Show the keyboard">
                <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 15h10"/></svg>
            </button>
            <button id="trackpad" class="toggle" type="button" aria-pressed="false" title="Drag anywhere to move the pointer, tap to click">Trackpad</button>
        </div>
        <span class="sep"></span>
        <button id="fullscreen" class="icon" type="button" aria-label="Fullscreen" title="Fullscreen">
            <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
    </div>
    <input id="type-here" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="enter" aria-label="Type into the game">

    <details>
        <summary>Details</summary>
        <div class="details-body">
            <div id="status">Loading…</div>
            <div id="midi_status"></div>
            <div class="tools" id="tools" hidden>
                <button id="save" type="button">Save disk</button>
                <button id="snapshot" type="button" hidden>Save snapshot</button>
                <span id="save_result"></span>
            </div>
        </div>
    </details>
</main>

<footer>
    Runs on <a href="https://github.com/copy/v86">v86</a> ·
    music by <a href="https://github.com/spessasus/spessasynth_lib">SpessaSynth</a> with
    <a href="https://www.schristiancollins.com/generaluser.php">GeneralUser GS</a>
</footer>

<script type="importmap">
{
    "imports": {
        "spessasynth_lib": "./lib/spessasynth_lib/index.js",
        "spessasynth_core": "./lib/spessasynth_core/index.js",
        "stb-vorbis": "./lib/stb-vorbis/index.js"
    }
}
</script>
<script type="module">
import { V86 } from "./v86/libv86.mjs";
import { connectMidi, midiStats } from "./midi.js";
import { trackPointer } from "./pointer.js";
import { attachKeyboard } from "./keyboard.js";

// Where the disks and snapshot live, and whether to offer Save disk and Save snapshot.
// The local server's config.json points at its disk routes; scripts/build-static.mjs
// writes one that points at chunked, compressed copies.
const config = await (await fetch("config.json")).json();

const params = new URLSearchParams(location.search);
// ?vgabios= picks the VGA BIOS: v86's own SeaBIOS 1.16.2 by default, "qemu" for
// QEMU 11.1's SeaBIOS 1.17.0 (has VBE function 09h, set palette), or "bochs" for
// the old Bochs LGPL one (Windows 98 fails to boot with it). Local server only.
const vgaBioses = {
    qemu: "bios/vgabios-qemu.bin",
    bochs: "bios/bochs-vgabios.bin",
};
const vgaBios = vgaBioses[params.get("vgabios")] ?? "bios/vgabios.bin";

// ?cd=win98 puts the Windows 98 CD in D: (for installing drivers) instead of Carmen.
const cd = config.cdroms[params.get("cd")] ?? config.cdroms.carmen;

// Fast start: resume a saved snapshot instead of booting Windows. Only for the normal
// setup, since a snapshot must match the hardware it was taken with. ?boot forces a boot.
const normalSetup = !params.has("boot") && !params.has("cd") && !params.has("vgabios");
const hasSnapshot = normalSetup && (await fetch(config.snapshot, { method: "HEAD" })).ok;
document.getElementById("tools").hidden = !config.tools;
document.getElementById("snapshot").hidden = !normalSetup;

const emulator = new V86({
    wasm_path: "v86/v86.wasm",
    memory_size: 128 * 1024 * 1024,
    vga_memory_size: 8 * 1024 * 1024,
    screen_container: document.getElementById("screen_container"),
    bios: { url: "bios/seabios.bin" },
    vga_bios: { url: vgaBios },
    hda: config.hda,
    cdrom: cd,
    initial_state: hasSnapshot ? { url: config.snapshot } : undefined,
    // Start paused behind the Start button: its click is the user gesture the browser
    // needs before it lets the page play sound.
    autostart: false,
});

// Exposed for debugging from the console.
window.emulator = emulator;

// Viewer settings, remembered per browser. Storage can be unavailable (private
// windows, blocked site data), so failures fall back to the defaults.
// Phones and tablets start at Fit; a 640×480 screen doesn't fit them at 1×.
const touchScreen = matchMedia("(pointer: coarse)").matches;
const smallScreen = matchMedia("(max-width: 900px), (max-height: 600px)").matches;
const settings = { volume: 80, muted: false, scale: touchScreen || smallScreen ? "fit" : "1", smooth: false, crt: false, trackpad: false };
try {
    Object.assign(settings, JSON.parse(localStorage.getItem("carmen.viewer") ?? "{}"));
} catch {}
function saveSettings() {
    try {
        localStorage.setItem("carmen.viewer", JSON.stringify(settings));
    } catch {}
}

// Clicking a control leaves focus on it, so Space or Enter in the game would press it
// again; hand focus back to the page.
function blurAfter(element) {
    element.addEventListener("click", () => element.blur());
}

// Volume: v86's sound (Sound Blaster and PC speaker, via its mixer) and the music synth
// both play through one gain node.
let master = null;
function applyVolume() {
    const mute = document.getElementById("mute");
    mute.setAttribute("aria-pressed", String(settings.muted));
    mute.title = mute.ariaLabel = settings.muted ? "Unmute" : "Mute";
    document.getElementById("volume").value = settings.volume;
    if (master) master.gain.value = settings.muted ? 0 : (settings.volume / 100) ** 2;
}
document.getElementById("mute").addEventListener("click", () => {
    settings.muted = !settings.muted;
    applyVolume();
    saveSettings();
});
document.getElementById("volume").addEventListener("input", event => {
    settings.volume = Number(event.target.value);
    settings.muted = settings.volume === 0;
    applyVolume();
    saveSettings();
});
document.getElementById("volume").addEventListener("change", event => event.target.blur());
blurAfter(document.getElementById("mute"));

// Screen size: the screen keeps its own resolution and is scaled with a transform;
// #scaler takes the scaled size so the page lays out around it.
const stage = document.getElementById("stage");
const scaler = document.getElementById("scaler");
const screen = document.getElementById("screen_container");
const canvas = screen.querySelector("canvas");
function screenSize() {
    // In graphics modes the canvas holds the real resolution; text mode uses the div.
    if (canvas.style.display !== "none" && canvas.width) return { width: canvas.width, height: canvas.height };
    return { width: screen.offsetWidth || 640, height: screen.offsetHeight || 480 };
}
// The largest scale at which the bezel and the controls fit in the window. The controls
// sit below the game, or beside it on a phone held sideways.
function fitScale({ width, height }) {
    if (document.fullscreenElement === stage) return Math.min(innerWidth / width, innerHeight / height);
    const main = document.querySelector("main");
    const mainStyle = getComputedStyle(main);
    const toolbar = document.querySelector(".toolbar");
    const bezel = document.querySelector(".bezel");
    const chromeWidth = bezel.offsetWidth - scaler.offsetWidth;
    const chromeHeight = bezel.offsetHeight - scaler.offsetHeight;
    const gap = parseFloat(mainStyle.rowGap) || 0;
    const top = main.getBoundingClientRect().top + scrollY + parseFloat(mainStyle.paddingTop);
    let maxWidth = document.documentElement.clientWidth - 2 * parseFloat(mainStyle.paddingLeft) - chromeWidth;
    let maxHeight = innerHeight - top - parseFloat(mainStyle.paddingBottom) - chromeHeight;
    if (mainStyle.flexDirection === "row") maxWidth -= toolbar.offsetWidth + gap;
    else maxHeight -= toolbar.offsetHeight + gap;
    return Math.max(0.25, Math.min(maxWidth / width, maxHeight / height));
}
function applyScale() {
    const size = screenSize();
    const fullscreen = document.fullscreenElement === stage;
    const scale = fullscreen || settings.scale === "fit" ? fitScale(size) : Number(settings.scale);
    screen.style.transform = `scale(${scale})`;
    scaler.style.width = `${Math.round(size.width * scale)}px`;
    scaler.style.height = `${Math.round(size.height * scale)}px`;
    for (const button of document.querySelectorAll("#size button")) {
        button.setAttribute("aria-pressed", String(button.dataset.scale === settings.scale));
    }
    stage.classList.toggle("smooth", settings.smooth);
    document.getElementById("smooth").setAttribute("aria-pressed", String(settings.smooth));
    document.getElementById("crt").hidden = !settings.crt;
    document.getElementById("crt-toggle").setAttribute("aria-pressed", String(settings.crt));
}
for (const button of document.querySelectorAll("#size button")) {
    button.addEventListener("click", () => {
        settings.scale = button.dataset.scale;
        applyScale();
        saveSettings();
    });
    blurAfter(button);
}
for (const [id, key] of [["smooth", "smooth"], ["crt-toggle", "crt"]]) {
    const button = document.getElementById(id);
    button.addEventListener("click", () => {
        settings[key] = !settings[key];
        applyScale();
        saveSettings();
    });
    blurAfter(button);
}
// Fullscreen: on a computer just the game; on a touch screen the whole page, so the
// controls stay reachable, turned to landscape where the browser allows it. iPhone
// Safari doesn't do fullscreen for pages, so there the button is hidden and Add to
// Home Screen opens the page full-screen instead.
const fullscreenButton = document.getElementById("fullscreen");
fullscreenButton.hidden = !document.fullscreenEnabled;
fullscreenButton.addEventListener("click", async () => {
    if (document.fullscreenElement) {
        await document.exitFullscreen();
        return;
    }
    if (touchScreen) {
        await document.documentElement.requestFullscreen();
        await window.screen.orientation?.lock?.("landscape").catch(() => {});
    } else {
        await stage.requestFullscreen();
    }
});
blurAfter(fullscreenButton);

// Trackpad mode (touch screens): drag to move Windows' pointer, tap to click.
const trackpadButton = document.getElementById("trackpad");
let pointer = null;
function applyTrackpad() {
    trackpadButton.setAttribute("aria-pressed", String(settings.trackpad));
    pointer?.setTrackpad(settings.trackpad);
}
trackpadButton.addEventListener("click", () => {
    settings.trackpad = !settings.trackpad;
    applyTrackpad();
    saveSettings();
});
blurAfter(trackpadButton);

// The keyboard button opens the device's on-screen keyboard. It mustn't take focus
// itself, or tapping it again would close the keyboard and reopen it.
const keyboard = attachKeyboard(emulator, document.getElementById("type-here"));
const keyboardButton = document.getElementById("keyboard");
keyboardButton.addEventListener("pointerdown", event => event.preventDefault());
keyboardButton.addEventListener("click", () => keyboard.toggle());
// The screen's own size changes with Windows' display mode (text, 640×480, …).
new ResizeObserver(applyScale).observe(screen);
new MutationObserver(applyScale).observe(canvas, { attributes: true, attributeFilter: ["width", "height", "style"] });
addEventListener("resize", applyScale);
document.addEventListener("fullscreenchange", applyScale);
applyVolume();
applyScale();

// Loading progress for the larger downloads (emulator, snapshot, BIOS).
const start = document.getElementById("start");
const startLabel = start.querySelector(".label");
const startHint = start.querySelector(".hint");
emulator.add_listener("download-progress", event => {
    if (!start.disabled || !event.lengthComputable || !event.total) return;
    const percent = Math.floor(100 * event.loaded / event.total);
    startHint.textContent = `Downloading ${event.file_name.split("/").pop()} · ${percent}%`;
});

let midiOutput = "connecting";
emulator.add_listener("emulator-loaded", () => {
    // Route v86's mixer through the page's volume control, and the synth with it.
    const context = emulator.speaker_adapter.audio_context;
    master = context.createGain();
    master.connect(context.destination);
    window.audioMaster = master; // for debugging from the console
    emulator.speaker_adapter.mixer.node_merger.disconnect();
    emulator.speaker_adapter.mixer.node_merger.connect(master);
    applyVolume();
    // The game's music is MIDI, sent to the SB16's MPU-401 port; play it in the page.
    connectMidi(emulator, master, text => midiOutput = text);
    // Windows' pointer follows the host pointer over the screen, without capturing it.
    pointer = trackPointer(emulator, canvas);
    applyTrackpad();
    start.disabled = false;
    startLabel.textContent = "Start";
    startHint.textContent = hasSnapshot ? "Carmen is waiting for you · sound on" : "Boots Windows 98 · sound on";
    start.focus();
});

// The click isn't passed on to Windows: it would land on whatever is under it.
start.addEventListener("click", () => {
    // On iPhones, play even with the silent switch on (newer Safari only).
    if (navigator.audioSession) navigator.audioSession.type = "playback";
    emulator.speaker_adapter?.audio_context.resume();
    emulator.run();
    start.hidden = true;
    start.blur();
});

// Show the synth's state and MIDI traffic in the details panel.
setInterval(() => {
    const s = midiStats;
    document.getElementById("midi_status").textContent =
        `MIDI: ${midiOutput} · port 330: ${s.mpuBytes} bytes · DSP MIDI: ${s.dspMidiBytes} bytes · sent ${s.sent}, errors ${s.errors}`;
}, 2000);

// v86 keeps hard disk writes in memory as 256-byte blocks. Save sends the written
// ones to the local server, which writes them into images/win98.img.
document.getElementById("save").addEventListener("click", async () => {
    const result = document.getElementById("save_result");
    if (!confirm("Only save once Windows has shut down (\"It's now safe to turn off your computer\"). Save now?")) return;
    const [blocks] = emulator.v86.cpu.devices.ide.primary.master.buffer.get_state();
    const body = new Uint8Array(blocks.length * 260);
    const view = new DataView(body.buffer);
    blocks.forEach(([index, data], i) => {
        view.setUint32(i * 260, index, true);
        body.set(data, i * 260 + 4);
    });
    result.textContent = `Saving ${blocks.length} blocks…`;
    const response = await fetch("save-disk", { method: "POST", body });
    result.textContent = response.ok ? await response.text() : `Save failed: ${await response.text()}`;
});

// Saves the whole running machine (memory, devices and unsaved disk writes) so the page
// can resume from this exact point. Saving the disk later retires it on the server.
document.getElementById("snapshot").addEventListener("click", async () => {
    const result = document.getElementById("save_result");
    result.textContent = "Saving snapshot…";
    const state = await emulator.save_state();
    const response = await fetch("save-state", { method: "POST", body: state });
    result.textContent = response.ok ? await response.text() : `Snapshot failed: ${await response.text()}`;
});

const status = document.getElementById("status");
status.textContent = hasSnapshot ? "Snapshot ready" : `Ready to boot (VGA BIOS: ${vgaBios})`;
// Poll the VGA device for the mode: VMDisp9x sets it directly, which v86 doesn't announce.
setInterval(() => {
    const vga = emulator.v86?.cpu.devices.vga;
    if (!vga || !emulator.is_running()) return;
    const mode = vga.svga_enabled ? `${vga.svga_width}×${vga.svga_height} · ${vga.svga_bpp}-bit` : "text mode";
    status.textContent = `Running (VGA BIOS: ${vgaBios}) · ${mode}`;
}, 1000);
</script>
</body>
</html>
